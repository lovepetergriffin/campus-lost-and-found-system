server:
  port: 8080

spring:
  application:
    name: campus-lost-and-found
  datasource:
    url: jdbc:h2:file:./.data/lostfound;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    token-secret: ${TOKEN_SECRET:campus-lost-found-local-secret-change-in-production-2026}
    token-expiration-seconds: 604800
